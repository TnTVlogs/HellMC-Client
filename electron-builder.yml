appId: 'hellmcclient'
productName: 'HellMC Client'
artifactName: '${productName}-setup.${ext}'

publish:
  provider: github
  owner: TnTVlogs
  repo: HellMC-Client
  releaseType: release



copyright: 'Copyright © 2017-2026 Daniel D. Scalzi, TnTVlogs'


asar: true
compression: 'maximum'

files:
  - '!{dist,renderer,test,biome.json,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc}'

extraResources:
  - 'libraries'
  - 'NOTICE'
  - 'LICENSE.txt'
  - 'LICENSE-LGPL-3.0.txt'
  - 'THIRD_PARTY_LICENSES.txt'

win: 
  target: 
    - target: 'nsis'
      arch: 'x64'
  icon: 'app/assets/images/SealCircle.ico'

# oneClick: true (Discord-style) — no install wizard ever, fresh install or silent
# auto-update, no "choose install folder"/elevation prompts (those options only apply
# to the multi-step wizard, incompatible with oneClick, so they're dropped here).
nsis:
  oneClick: true

mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'
  icon: 'app/assets/images/SealCircle.icns'

linux: 
  target: 'AppImage'
  maintainer: 'TnTVlogs'
  vendor: 'TnTVlogs'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'
  icon: 'app/assets/images/logo_linux.png'

directories:
  buildResources: 'build'
  output: 'dist'
