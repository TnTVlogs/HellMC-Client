appId: 'hellmcclient'
productName: 'HellMC Client'
artifactName: '${productName}-setup.${ext}'

publish:
  provider: github
  owner: TnTVlogs
  repo: HellMC-Client
  releaseType: release



copyright: 'Copyright © 2026 TnTVlogs'


asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,.eslintrc.json}'

extraResources:
  - 'libraries'

win: 
  target: 
    - target: 'nsis'
      arch: 'x64'
  icon: 'app/assets/images/SealCircle.ico'

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'
  icon: 'app/assets/images/SealCircle.icns'

linux: 
  target: 'AppImage'
  maintainer: 'TnTVlogs'
  vendor: 'TnTVlogs'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'
  icon: 'app/assets/images/logo_linux.png'

directories:
  buildResources: 'build'
  output: 'dist'
