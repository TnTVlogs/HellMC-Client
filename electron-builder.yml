appId: 'hellmcclient'
productName: 'HellMC Client'
artifactName: 'HellMC-Client-Setup.${ext}'

publish:
  provider: github
  owner: TnTVlogs
  repo: HellMC-Client
  releaseType: draft



copyright: 'Copyright © 2017-2026 Daniel D. Scalzi, TnTVlogs'


asar: true
# LGPL (B8): `hellmc-core` va FORA de l'asar (a `resources/app.asar.unpacked/node_modules/hellmc-core`) perquè es pugui
# substituir per una versió modificada copiant fitxers (vegeu NOTICE, «Com substituir hellmc-core»). Aquests fitxers
# NO queden coberts per la validació d'integritat de l'asar (`enableEmbeddedAsarIntegrityValidation`): decisió assumida.
# Les seves dependències (got, winston…) continuen dins l'asar; Electron les resol per la ruta virtual de l'asar.
asarUnpack:
  - 'node_modules/hellmc-core/**'
compression: 'maximum'

files:
  - '!{dist,runtime,renderer,test,biome.json,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc}'

extraResources:
  - 'libraries'
  - 'NOTICE'
  - 'LICENSE.txt'
  - 'LICENSE-LGPL-3.0.txt'
  - 'THIRD_PARTY_LICENSES.txt'

win: 
  target: 
    - target: 'nsis'
      arch: 'x64'
  icon: 'app/assets/images/SealCircle.ico'

# oneClick: true (Discord-style) — no install wizard ever, fresh install or silent
# auto-update, no "choose install folder"/elevation prompts (those options only apply
# to the multi-step wizard, incompatible with oneClick, so they're dropped here).
nsis:
  oneClick: true
  # D16: en desinstal·lar s'esborra la carpeta de dades del launcher (config, tokens, logs). No toca els mons ni les
  # versions instal·lades (carpeta de dades del joc). Una actualització NO l'esborra.
  deleteAppDataOnUninstall: true

# macOS sense signatura (Developer ID): no hi ha actualització automàtica, només avís + descàrrega manual
# (vegeu index.js i docs 12 C3c). Si algun dia es signa, cal afegir aquí el target 'zip' (és el que llegeix
# electron-updater) i tornar a activar `autoDownload` a darwin.
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'
  icon: 'app/assets/images/SealCircle.icns'

linux: 
  target: 'AppImage'
  maintainer: 'TnTVlogs'
  vendor: 'TnTVlogs'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'
  icon: 'app/assets/images/logo_linux.png'

directories:
  buildResources: 'build'
  output: 'dist'

# S10: *fuses* d'Electron. `runAsNode` desactivat (B23): el receptor de descàrregues (`HellMC-Core`) ja no es llança amb
# `child_process.fork` sobre el binari d'Electron sinó amb `utilityProcess` (`src-node/receiverSpawner.js`). Cap altre codi
# fa servir `ELECTRON_RUN_AS_NODE`. Rollback d'una línia: `runAsNode: true` (i injectar `NodeForkSpawner` a Core).
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
