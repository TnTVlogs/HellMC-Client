appId: 'hellmcclient'
productName: 'HellMC Client'
artifactName: 'HellMC-Client-Setup.${ext}'

publish:
  provider: github
  owner: TnTVlogs
  repo: HellMC-Client
  releaseType: draft



copyright: 'Copyright © 2017-2026 Daniel D. Scalzi, TnTVlogs'


asar: true
compression: 'maximum'

files:
  - '!{dist,renderer,test,biome.json,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc}'

extraResources:
  - 'libraries'
  - 'NOTICE'
  - 'LICENSE.txt'
  - 'LICENSE-LGPL-3.0.txt'
  - 'THIRD_PARTY_LICENSES.txt'

win: 
  target: 
    - target: 'nsis'
      arch: 'x64'
  icon: 'app/assets/images/SealCircle.ico'

# oneClick: true (Discord-style) — no install wizard ever, fresh install or silent
# auto-update, no "choose install folder"/elevation prompts (those options only apply
# to the multi-step wizard, incompatible with oneClick, so they're dropped here).
nsis:
  oneClick: true
  # D16: en desinstal·lar s'esborra la carpeta de dades del launcher (config, tokens, logs). No toca els mons ni les
  # versions instal·lades (carpeta de dades del joc). Una actualització NO l'esborra.
  deleteAppDataOnUninstall: true

# macOS sense signatura (Developer ID): no hi ha actualització automàtica, només avís + descàrrega manual
# (vegeu index.js i docs 12 C3c). Si algun dia es signa, cal afegir aquí el target 'zip' (és el que llegeix
# electron-updater) i tornar a activar `autoDownload` a darwin.
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'
  icon: 'app/assets/images/SealCircle.icns'

linux: 
  target: 'AppImage'
  maintainer: 'TnTVlogs'
  vendor: 'TnTVlogs'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'
  icon: 'app/assets/images/logo_linux.png'

directories:
  buildResources: 'build'
  output: 'dist'

# S10: *fuses* d'Electron. `runAsNode` es queda activat: el receptor de descàrregues (`HellMC-Core`) es llança amb
# `child_process.fork` sobre el binari d'Electron i en depèn (només es podrà desactivar migrant-lo a `utilityProcess`).
electronFuses:
  runAsNode: true
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
